# Runtime settings shared by live mode, clip mode and the API.
exercise_config: exercises/shoulder_abduction.yaml   # relative to configs/
capture:
  camera_index: 0
  width: 640
  height: 480
  target_fps: 30
buffer:
  seconds: 20            # ring buffer kept for agent re-analysis
  downscale_width: 640
quality:                 # measured on a grey copy resized to analysis_width
  analysis_width: 320
  low_light_brightness: 60     # mean grey level below this → low_light
  overexposed_brightness: 225  # mean grey level above this → overexposed
  min_contrast: 15             # grey std below this → low_contrast (e.g. lens covered)
  blur_laplacian_var: 50       # Laplacian variance below this → blurry
storage:
  backend: local         # local | aws
  local_dir: data/sessions
  bucket: null           # set via KINEVRA_BUCKET in AWS
  table: null            # set via KINEVRA_TABLE in AWS
logging:
  level: INFO
  json: false
