# PROTOTYPE DEFAULTS — not clinical thresholds. Tune from your own data.
exercise: shoulder_abduction
side: right
landmarks:
  primary_angle: [hip, shoulder, elbow]
  elbow_angle: [shoulder, elbow, wrist]
visibility_threshold: 0.5
processing_fps: 15
smoothing:
  one_euro: {min_cutoff: 1.0, beta: 0.05, d_cutoff: 1.0}   # live mode
  savgol: {window_s: 0.4, polyorder: 2}                     # clip mode (offline)
  max_gap_s: 0.3            # tracking gaps longer than this reset/split the filters
features:
  elevation_baseline_s: 1.0 # rest time (arm down) used as the shoulder-height baseline
reps:
  rest_angle_max: 30
  raise_margin: 15
  min_rom: 40
  min_duration_s: 0.8
  max_duration_s: 10
baseline:
  first_n_good_reps: 3
  recent_k: 5
  trend_deadband_deg_per_rep: 2.0   # |ROM slope| below this → "stable"
  confidence_window_s: 5.0          # rolling tracking confidence / flag window
rules:
  rom_ratio_deviation: 0.80
  max_trunk_lean_deg: 10
  max_elbow_flexion_deg: 30
  max_shoulder_elevation: 0.10      # shrug: shoulder height +10% over rest baseline
  min_confidence: 0.6
  uncertain_flag_fraction: 0.3      # quality flag on >30% of a rep's frames → UNCERTAIN
tools:
  reanalyze_roi_scale: 2.0
  reanalyze_trigger_confidence: [0.45, 0.75]   # borderline band → agent should look again
  flow_roi_padding: 0.15
  reanalyze_max_frames: 45          # frames re-run per rep (evenly subsampled)
  flow_jitter_ratio: 1.6            # landmark path > 1.6x optical-flow path → landmark jitter
  camera_issue_fraction: 0.3        # issue on >30% of the checked frames → report it
  subject_torso_frac: [0.12, 0.45]  # torso height / frame height outside this → too far/close
agent:
  max_tool_calls: 4
  feedback_min_reps_between: 2
  triage_min_smoothness: 0.85       # smoother reps than this need no second look
  quality_check_interval_s: 5.0     # re-check the camera this often while data is poor
  escalation:
    consecutive_confirmed_deviations: 3
    rom_ratio_below: 0.80
llm:
  provider: bedrock
  model_id: "<model enabled in your region>"   # override with KINEVRA_LLM_MODEL_ID
  region: "<your region>"                      # override with KINEVRA_LLM_REGION
  temperature: 0.2
  timeout_s: 4
limits:
  max_clip_seconds: 90
  max_upload_mb: 50
