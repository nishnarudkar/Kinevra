name: trunk-lean compensation gets posture feedback
description: A well-tracked rep with 14° lean gets the approved posture instruction.
steps:
  - rep:
      {rep_index: 3, rom: 132, max_trunk_lean: 14, confidence: 0.92, rule_quality: DEVIATION,
       rule_reasons: ["trunk_lean: 14.0° away from the arm > 10°"]}
    llm:
      - tool_calls: [{name: calculate_movement_metrics, args: {rep_index: 3}}]
      - final:
          action: PROVIDE_FEEDBACK
          rationale: "Trunk lean 14° (> 10°) with normal ROM 132°."
          feedback_text: "Keep your body upright and let only your arm move."
          feedback_category: trunk_lean
          evidence_refs: {rep_index: 3, max_trunk_lean: 14}
    expect:
      action: PROVIDE_FEEDBACK
      tools: [calculate_movement_metrics]
      feedback_contains: "upright"
      changed_assessment: false
