# Uses the project's own pinned tools via uv, so versions come from uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-media
        name: block video / model files
        entry: media and model files must not be committed (see PROJECT.md §13)
        language: fail
        files: '\.(mp4|mov|avi|mkv|webm|onnx)$'
