name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install (headless OpenCV 5)
        run: make setup CV_EXTRA=headless
      - name: OpenCV version
        run: uv run python -c "import cv2; print(cv2.__version__)"
      - name: Cache pose models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('scripts/download_models.py') }}
      - name: Download + verify pose models
        run: uv run python scripts/download_models.py
      - name: Lint
        run: make lint
      - name: Test
        run: make test
